#edit-toggle-btn{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;background:rgba(183,148,244,0.12);border:1px solid rgba(183,148,244,0.25);color:rgba(183,148,244,0.65);font-family:'Outfit',sans-serif;font-size:8px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;padding:7px 14px;border-radius:99px;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(6px);}

<script>

const story_content = "<div class=\"cold-open\">\n  <p style=\"font-family:'DM Serif Display',serif;font-size:1.1rem;color:rgba(183,148,244,0.5);letter-spacing:0.08em;text-align:center;margin:0 0 0.5rem 0;\">isang taon pagkatapos</p>\n  <p style=\"font-family:'Outfit',sans-serif;font-size:9px;color:rgba(183,148,244,0.3);letter-spacing:0.35em;text-transform:uppercase;text-align:center;margin:0;\">dean reyes \u00b7 tagasalaysay \u00b7 pangwakas</p>\n</div>\n\n<p class=\"opener\">Dati ay naisip ko na kailangan mong maayos ang lahat bago ka makasulong. Na may bersyon ng tapos na kailangan mong maabot muna. Isang sandali kung saan lahat ng bukas na bagay ay sa wakas ay nagsasara at makakatingin ka sa paligid at masasabi: okay. Ngayon na makakapagsimula na ako. Lumipas ang isang taon at natutunan ko na hindi ganoon gumagana ang mga bagay.</p>\n\n<p>Ang mga bukas na bagay ay hindi nagsasara. Nagiging pamilyar lang sila. Natututo kang ang hugis nila. Titigil kang magpapalo sa mga gilid nila araw-araw. Makakakita ka ng paraan ng patuloy na paglakad na may hawak sa kanila, hindi dahil naging mas magaan ang mga ito, kundi dahil sanay na ang iyong mga braso sa bigat.</p>\n\n<p>Hindi iyon pagsusuko. Hindi iyon pakikipag-ayos. Iyon lang \u2014 kung ano ang hitsura kapag nagpapatuloy ang mga tao. Kapag nagpasya sila, nang walang drama at nang walang pahayag, na subukang muli pa rin.</p>\n\n<p>Isang taon ang lumipas para maunawaan ko iyon. Isang taon, at isang gabi, at isang konsiyerto kung saan sa wakas ay may katapusan na ang kanta.</p>\n\n<div class=\"brk\">\u00b7 \u00b7 \u00b7</div>\n\n<div class=\"sec-head\">\n  <span class=\"sec-num\">Isa</span>\n  <span class=\"sec-title\">Kung Nasaan Na Sila</span>\n</div>\n\n<span class=\"scene-label\">Isang Taon Mamaya \u00b7 Iba-iba \u00b7 Bago ang Konsiyerto</span>\n\n<p>Hayaan ninyo akong sabihin sa inyo kung nasaan na ang lahat, bago ko sabihin kung nasaan sila napunta nang gabing iyon.</p>\n\n<div class=\"montage\">\n  <div class=\"montage-item\" style=\"border-left:3px solid rgba(251,182,206,0.3);padding-left:1.2rem;margin-bottom:1.8rem;\">\n    <span style=\"font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(251,182,206,0.5);display:block;margin-bottom:0.6rem;\">Carlo</span>\n    <p style=\"margin:0;color:rgba(232,223,245,0.55);\">Nakuha niya ang promosyon. Head bar manager na sa Float \u2014 ang titulo na nangangahulugang mas mahabang oras sa papel at kahit papaano mas maraming espasyo para huminga sa praktiko, dahil dumating ito kasama ang awtoridad na gawing kaniya ang iskedyul. Nagtatrabaho pa rin siya nang gabi-gabi minsan, sa kanyang sariling pagpili. Ginagawa pa rin ang strawberry swirl na may dagdag na drizzle para sa unang mesa ng umaga. Pero umuuwi na siya sa tamang oras ngayon. Umalis siya dahil may puntahan pa siya, hindi dahil wala nang ibang mapuntahan. Bago umalis nang Biyerneng iyon, sumulat siya ng isang bagay sa likod ng isang resibo sa paraan ng nagsimula na niyang gawin \u2014 maliliit na tala, para sa kanyang sarili karamihan, minsan iniiwanan sa mga mesa para mahanap ng mga estranghero. Tiningpi niya ito at inilagay sa bulsa ng jacket niya. Sininehan ang bar. Lumabas sa gabi, at sa unang pagkakataon ng mas matagal kaysa kaya niyang sukatin, ang gabi ay pakiramdam na sa kanya ito.</p>\n  </div>\n\n  <div class=\"montage-item\" style=\"border-left:3px solid rgba(129,230,217,0.3);padding-left:1.2rem;margin-bottom:1.8rem;\">\n    <span style=\"font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(129,230,217,0.5);display:block;margin-bottom:0.6rem;\">Abby</span>\n    <p style=\"margin:0;color:rgba(232,223,245,0.55);\">Tapos na ang thesis. Naisumite, nagmarkahan, naibigkis, naipile. Ang pamagat ay nananatiling <em>Konseptwal na Paglalarawan ng Pagnanasa</em> \u2014 pinananatili niya ito, hindi dahil nalutas niya ang pagnanasa, kundi dahil sa wakas ay naiintindihan na niya ito mula sa loob at labas nang sabay, at naisip niya na iyan ay karapat-dapat sa pananaliksik. Nagse-sketch na siya ulit. Para sa kanyang sarili \u2014 hindi para sa pagnanasa, hindi para sa akademikong dokumentasyon ng emosyonal na heograpiya ng ibang tao. Lang: mga bagay na nakita niya na gustong panatilihin. Ang puno ng bayabas sa labas ng isang care home. Isang resibong may sulat sa likod. Isang dilaw na damit na nakabitin sa likod ng isang aparador, hindi pa isinusuot, hindi pa tinatapunan. Kanya na uli ang sketchpad. Mahalaga iyon.</p>\n  </div>\n\n  <div class=\"montage-item\" style=\"border-left:3px solid rgba(246,173,85,0.3);padding-left:1.2rem;margin-bottom:1.8rem;\">\n    <span style=\"font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(246,173,85,0.5);display:block;margin-bottom:0.6rem;\">Lauren</span>\n    <p style=\"margin:0;color:rgba(232,223,245,0.55);\">Hindi siya nagsuot ng dilaw mula sa karnabali. Hindi nang sadya, hindi bilang pahayag \u2014 huminto na lang ito sa pagiging unang kulay na iniaabot niya. Pumalit ang ibang mga kulay. Mas malakas na siya ulit sa mga puntong mahalaga at mas tahimik sa mga paraan na nagpe-perform siya. Bumalik ang tawa \u2014 ang tunay, ang sumasakop sa kanyang mukha bago pa niya mapigilan. Wala ito nang matagal. Hindi niya napansin na wala ito hanggang sa bumalik. Siya at si Abby ay hindi katulad ng dati. Mas mabuti nga, sa totoo \u2014 hindi ang madaling kalapitan ng mga taong hindi kailanman kailangang mag-ayos ng isang bagay, kundi ang mas matibay na kalapitan ng mga taong ginawa, at ginawa, at nanghawak pa rin.</p>\n  </div>\n\n  <div class=\"montage-item\" style=\"border-left:3px solid rgba(183,148,244,0.3);padding-left:1.2rem;margin-bottom:1.8rem;\">\n    <span style=\"font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(183,148,244,0.5);display:block;margin-bottom:0.6rem;\">Dean</span>\n    <p style=\"margin:0;color:rgba(232,223,245,0.55);\">Hindi ako karakter sa sarili kong kwento sa paraan ng iba. Ako ang nagmamasid, ang naghahanap ng mga pangungusap, ang gumugol ng sampung kabanata bilang koridor na dinadaanan ng lahat papunta sa ibang lugar. Pero ngayong taon, may nagbago. Hindi ko eksakto masabi \u2014 hindi ito isang kaganapan, hindi usapan, hindi desisyon na naalala kong ginawa. Katulad ito ng: isang unti-unting oryentasyon. Nagsimula akong sumulat ng mga bagay para sa aking sarili. Hindi para kay Keith, hindi para sa sinuman. Lang: ang mga bagay na nakita ko, ang mga bagay na naramdaman ko, ang tunay na bersyon ng nangyayari sa kwartong ang buhay ko ito. Tinahimik ko ang paggamit ng notebook para sa mga karanasan ng ibang tao. Natututo pa rin akong maging nasa loob ng isang kwarto sa halip na irekord lang ito. Nagiging mas mabuti. Dahan-dahan. Iyon ay may bibilang.</p>\n  </div>\n\n  <div class=\"montage-item\" style=\"border-left:3px solid rgba(246,201,14,0.3);padding-left:1.2rem;margin-bottom:0;\">\n    <span style=\"font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(246,201,14,0.5);display:block;margin-bottom:0.6rem;\">Owen</span>\n    <p style=\"margin:0;color:rgba(232,223,245,0.55);\">Nakuha ng banda ang slot. Hindi sikat-sikat \u2014 isang lehitimong medium-sized na venue, isang tunay na sound system, isang crowd na nakarinig na sa kanila at pumunta nang espesipiko, nang may intensyon, dahil sa musika. Nagtayo si Owen patungo rito ng maraming taon nang hindi alam kung saan siya nagtatatayo patungo. Lumabas na nagtatatayo siya patungo sa isang entabladong sapat na laki para hawakan ang natapos na kanta. Natapos na niya ito. Tatlong linggo pagkatapos ng libing, nag-iisa sa practice room nang alas-dos ng umaga, sa wakas ay nahanap ng ikaapat na linya ang hugis nito. Matagal siyang naupo pagkatapos nito \u2014 siya lang at si Cassiopea at ang nakumpletong bagay, ang kanta na hindi natapos nang napakatagal ng hindi naresolba ang bagay na nagbigay-inspirasyon dito. Tapos na ngayon. Pareho sa kanila.</p>\n  </div>\n</div>\n\n<div class=\"receipt-card\">\n  <span style=\"font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(251,182,206,0.4);display:block;margin-bottom:0.7rem;\">bulsa ng jacket ni Carlo \u00b7 Biyernes ng gabi</span>\n  <p style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:rgba(232,223,245,0.6);margin:0;line-height:2;\">\"Kung pagod ka, magpahinga. Pero huwag sumuko.\"</p>\n</div>\n\n<div class=\"brk\">\u00b7 \u00b7 \u00b7</div>\n\n<div class=\"sec-head\">\n  <span class=\"sec-num\">Dalawa</span>\n  <span class=\"sec-title\">Ang Venue</span>\n</div>\n\n<span class=\"scene-label\">Riverside Concert Hall \u00b7 Biyernes \u00b7 8:00 PM</span>\n\n<p>Ang venue ay hindi malaki. Hindi ang uri ng lugar kung saan nawawala ang mga tao \u2014 makikita mo pa rin ang iyong mga kaibigan sa pamamagitan ng pag-scan ng kwarto. Pero tunay ito. Ang mga ilaw ay tunay, ang sound system ay tunay, ang crowd ay isang crowd sa halip na isang audience ng mga regular na napadaan sa daan ng ibang lugar. Ito ay isang palabas na pinili ng mga tao. Mahalaga iyon.</p>\n\n<p>Si Carlo ay unang dumating. Pumunta siya nang direkta mula sa bar \u2014 bahagyang mabango pa ng hapon na shift, ang komportableng amoy ng isang lugar na ginawa na niyang kaniya \u2014 at nahanap niya ang isang lugar malapit sa kaliwang bahagi ng kwarto kung saan makikita niya ang entablado at pati na rin ang pintuan. Lumang gawi. Matagal na siyang taong nagbabantay ng pintuan. Ginagawa pa rin niya ito, pero ngayon ay mas katulad ito ng tiyak na kasiyahan ng panonood ng mga tao na dumadating sa isang espasyong mainit at sila na at puno ng isang bagay na maganda.</p>\n\n<p>Si Abby at si Lauren ay magkasamang dumating. Nasa kalagitnaan na sila ng isang usapan nang pumasok sila \u2014 isang bagay na nagpatawa kay Lauren, ang tunay, ang hindi kontrolado, bago pa man sila ganap na tumawid sa pintuan. Nandoon na ako sa loob at pinanood ko silang pumasok at naramdaman ang isang bagay na humupa na hindi ko naamoy na hindi pa nahuhulog. Nahanap nila si Carlo. Niyakap niya silang dalawa, maikli, ang madaling hindi ginagawang init ng isang taong natututo, ngayong taon, kung paano hayaan ang mga tao nang malapit nang walang kalkulahin ang gastos muna.</p>\n\n<p>Pumasok ako pagkatapos. Nanatili ako malapit sa likod nang sandali \u2014 ang lumang instinct, ang posisyon ng tagamasid. Pagkatapos ay humakbang ako pasulong. Nahanap ko sila malapit sa harap-kaliwa, kaming apat na nagtipon nang walang seremonya, nang walang pahayag, lang: nandito na naman tayo. Sa parehong kwarto. Isang taon pagkatapos ng pinaka-masamang gabi, nakatayo sa init ng isang konsiyertong malapit nang magsimula, nasa orbit pa rin ng isa't isa.</p>\n\n<p>Nandoon din si Keith. Nasa kabilang panig ng kwarto, malapit sa kanan, kasama si Ari sa tabi niya. Nakita niya ako nang pumasok ako. Bahagyang itinangong ang baba \u2014 ang maliit na pagkilala ng dalawang taong may pag-unawa. Tumango ako pabalik. Iyon lang ang buong bagay. Sapat na iyon. Ang distansya sa pagitan namin ay hindi malamig. Iyon lang \u2014 ang distansya. Komportable. Kilala. Ang hugis ng isang bagay na nahanap na ang tamang proporsyon nito.</p>\n\n<div class=\"brk\">\u00b7 \u00b7 \u00b7</div>\n\n<div class=\"sec-head\">\n  <span class=\"sec-num\">Tatlo</span>\n  <span class=\"sec-title\">Ang Kanta</span>\n</div>\n\n<span class=\"scene-label\">Ang Entablado \u00b7 9:15 PM</span>\n\n<p>Tatlong cover ang binuksan ng banda. Magagandang cover \u2014 ang uri na nagpapainit ng kwarto nang walang hinahilingin sa kanya. Nag-loosen ang crowd. Humupa ang mga usapan. Sa oras na nagsimula ang ikaapat na kanta, lahat ng nasa kwarto ay gumawa ng maliit na kolektibong desisyon na maging nandito, tunay na nandito, na isang ibang bagay kaysa sa nakatayo lang sa venue.</p>\n\n<p>Pagkatapos ay bahagyang humakbang pasulong si Owen. Hindi nang dramatiko \u2014 ang hakbang lang ng isang taong nag-aayos ng posisyon, nagiging sentro ng bagay. Tumingin siya sa kwarto. Pinanood ko ang kanyang mukha mula sa kinatatayuan ko. Mayroon siya ng kalidad na mayroon siya kapag tumutugtog siya ng isang bagay na mahalaga \u2014 hindi kinakabahan, hindi nagpe-perform, lang: nandoon. Ganap na nasa bagay. Sa paraan na mayroon siya kapag ang kanta ay huminto sa pagiging tungkol sa kontrol at naging tungkol sa katotohanan.</p>\n\n<p>Sinabi niya sa mic: \"Ito ang huli. Matagal kong tinatapos ito.\"</p>\n\n<p>Iyon lang. Hindi niya ipinaliwanag kung ano ang tungkol dito. Hindi niya pinangalanan ang sinuman. Nagsimula na lang siyang tumugtog.</p>\n\n<div class=\"concert-block\">\n  <span style=\"font-family:'Outfit',sans-serif;font-size:7px;letter-spacing:0.35em;text-transform:uppercase;color:rgba(246,201,14,0.35);display:block;margin-bottom:1rem;\">ang natapos na kanta \u00b7 Vintage Needlepoint \u00b7 live</span>\n  <div class=\"song-fragment\">\n    <p>Hawak mo ang aking kamay sa gabi<br>\n    Pero ang isip mo ay nasa ibang lugar<br>\n    Sinasabi mong ako ang isa<br>\n    Pero hindi ko talaga masabi</p>\n    <p>Dahil bawat beses na tumingin ka sa akin<br>\n    Ang mga mata mo ay lumalapit-sa-malayo<br>\n    Parang may isang tao sa puso mo<br>\n    Na hindi talaga nagbago</p>\n    <p>At sinusubukan ko \u2014<br>\n    na maging sapat para mapananatili kita ngayong gabi</p>\n    <p style=\"color:rgba(246,201,14,0.6);font-weight:500;\">Kaya halikan mo ako na para bang ibig mo<br>\n    Kahit hindi sa akin ang puso mo<br>\n    Yakapin mo ako na para bang kailangan mo ako<br>\n    Para lang sa isang huling beses ngayong gabi</p>\n    <p>At bawat beses na hinihila mo ako nang malapit<br>\n    Nararamdaman ko siya sa pagitan<br>\n    Diyos, galit na galit ako sa sarili ko kung gaano kita kinamahal<br>\n    Isang taong aalis na noon pa</p>\n  </div>\n</div>\n\n<div class=\"item-card\" style=\"--tc:#f6c90e;\">\n  <span style=\"font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(246,201,14,0.4);display:block;margin-bottom:0.8rem;\">ang kwarto sa panahon ng kanta</span>\n  <div style=\"font-family:'Outfit',sans-serif;font-size:12px;font-weight:300;color:rgba(232,223,245,0.4);line-height:2.1;font-style:italic;\">\n    <div>Alam ng mga tao ang mga salita. Hindi lahat \u2014 pero sapat. Isang seksyon malapit sa harap ang may saradong mga mata, bahagyang gumagalaw.</div>\n    <div>Ang crowd ay may kalidad na nakukuha ng isang kwarto kapag ang isang kanta ay gumagawa ng dapat gawin ng mga kanta \u2014 hindi nag-eentertain, hindi pinupuno ang katahimikan, kundi tunay na nagsasabi ng isang bagay na kailangan ng isang tao na sabihin nang malakas, para sa lahat ng hindi pa nakakasabi nito nang mag-isa.</div>\n    <div>Si Carlo ay nakatayo nang walang galaw. Mga kamay sa mga bulsa ng jacket. Ang tiyak na katahimikan ng isang taong naiintindihan, mula sa personal na karanasan, ang eksakto na bigat ng pagmamahal sa isang taong nasa ibang lugar.</div>\n    <div>Huminto na si Abby sa pag-sketch. Si Lauren ay nasa tabi niya, tinitingnan ang entablado, ang kanyang mukha ay bukas sa paraang hindi niya palagi pinahihintulutan.</div>\n    <div>At pinanood ko si Owen. Tinitingnan niya ang kwarto \u2014 hindi isang mukha, hindi isang tiyak na punto sa crowd. Lang: ang kwarto. Ang kanta ay nagsasabi ng kailangan nitong sabihin kung nandoon man o wala ang taong para saan ito isinulat.</div>\n  </div>\n</div>\n\n<div class=\"concert-block\">\n  <div class=\"song-fragment\">\n    <p>Isang gabi ay naging tahimik ka<br>\n    Parang pinili mo na<br>\n    At pinanood kita na dahan-dahang lumayo<br>\n    Nang walang sinasabing kahit isang salita</p>\n    <p>Marahil bahagi ng pagmamahal sa iyo<br>\n    Ay pag-aaral kung paano matalo<br>\n    Dahil hindi ganoon mabilis mawala ang mga puso<br>\n    Maliban kung hindi kailanman sa iyo ang mga ito</p>\n    <p style=\"color:rgba(246,201,14,0.6);font-weight:500;\">Kaya halikan mo ako na para bang minahal mo ako<br>\n    Bago pa man nagbago ang isip mo<br>\n    Yakapin mo ako na para bang kailangan mo ako<br>\n    Para lang sa huling pagkakataon</p>\n    <p>Ngayon ang iyong bahagi ng kama<br>\n    Ay mas malamig kaysa dati<br>\n    Sa palagay ko ako ay isa lang na tao<br>\n    Na kailangan mo habang nagdadalamhati ka</p>\n    <p style=\"color:rgba(246,201,14,0.45);font-style:italic;\">Sinabi mong kailangan mong gumaling<br>\n    Hindi ko alam<br>\n    Na ibig mong sabihin \u2014 mula sa kanya.</p>\n  </div>\n</div>\n\n<p>Hinawakan ng kwarto ito nang sandali pagkatapos ng huling chord. Walang agad na palakpakan. Hindi dahil ayaw nila \u2014 kundi dahil ang kanta ay gumawa ng bagay na ginagawa lang ng pinakamahusay na mga kanta: lumapat sa tiyak na lugar kung saan ang sariling karanasan mo ay tahimik na nakaupo at inilawan ito nang walang pahintulot. Kailangan mo ng isang segundo. Para makabalik. Para alalahanin na nasa isang konsiyerto ka at hindi sa isang lugar na ganap na panloob.</p>\n\n<p>Pagkatapos ay nagsimula ang isang tao. Pagkatapos ang lahat.</p>\n\n<p>Nakatayo si Owen sa mic at tinanggap ito. Ang kanyang mukha ay hindi nagpe-perform ng pasasalamat. Hawak lang niya ito \u2014 ang tahimik, hindi pinamahalaan na bersyon ng isang taong natapos ang isang bagay na matagal na niyang dinadala. Hindi relief, eksakto. Mas katulad ng: pagkakumpleto. Ang pakiramdam ng isang pangungusap na nahanap na ang panahon nito.</p>\n\n<p>Wala si Alex. Natapos pa rin ang kanta. Sa tingin ko iyon ang punto.</p>\n\n<div class=\"brk\">\u00b7 \u00b7 \u00b7</div>\n\n<div class=\"sec-head\">\n  <span class=\"sec-num\">Apat</span>\n  <span class=\"sec-title\">Pagkatapos \u00b7 Ang Shoelace</span>\n</div>\n\n<span class=\"scene-label\">Sa Labas ng Venue \u00b7 11:00 PM</span>\n\n<p>Natapos ang konsiyerto sa paraan ng pagtatapos ng magagandang bagay \u2014 hindi may dramatikong finale, ang natural na konklusyon lang ng isang bagay na eksakto kung ano ang dapat. Dahan-dahan na kumalat ang crowd. Walang nagmadali. Ang hangin sa labas ay ang cool na katapusan-ng-taon na uri, ang lungsod na gumagawa ng gabi nitong bagay sa lahat ng nakatayo pa rin sa bangketa na nagpapasya kung mananatili o uuwi.</p>\n\n<p>Nanatili kami sa labas nang ilang sandali. Kaming lima, kasama si Keith sa bahagyang distansya, kasama si Ari sa tabi niya. Walang nag-anunsyo na nananatili kami. Ginawa na namin iyon. Si Carlo ay may mga kamay sa mga bulsa. Nagpapakita si Abby kay Lauren ng isang bagay sa kanyang sketchpad \u2014 ang salitang isinulat niya sa panahon ng kanta, ang linya na dumating nang walang hiling. Natawa si Lauren sa isang bagay tungkol dito, malumanay, sa paraan ng pagtawa niya ngayon, mula sa isang lugar na tunay na nasa loob niya sa halip ng isang lugar na napasya niya ang tamang lugar para lumabas ang tawa.</p>\n\n<p>Lumabas si Owen pagkatapos na nagtipon na ang lahat. Hawak pa rin ang case ni Cassiopea. Nakita niya kami at ginawa ang bagay na ginagawa niya \u2014 ang bahagyang paghinto, ang pagkilala, ang desisyon na lumapit kaysa lumayo. Nagtatrabaho siya sa bagay na iyon. Sa paglalapit. Mas mabuti na siya kaysa noong isang taon na ang nakakaraan.</p>\n\n<p>Hindi namin tinalakay ang lahat ng nangyari. Hindi kami nag-recap, nagdebrief, nag-formal na accounting ng kung ano ang nagastos ng taon at kung ano ang ibinalik nito. Nakatayo lang kami sa bangketa sa labas ng isang concert venue nang alasingko ng gabi at nagsalita tungkol sa kanta, at sa crowd, at kung ang sound system ba ay kasing galing ng sinabi ng venue, at kung gusto ba ng sinuman na humanap ng pagkain, at sinabi ni Carlo na mayroon siyang alam na isang lugar na bukas pa, at iyon lang ang buong bagay. Iyon ang buong reunion.</p>\n\n<div class=\"hugot\">\n  <p>Ang ordinaryo ay hindi pinapahalagahan bilang isang katapusan. Inaasahan natin na ang pagiging pinal ay mukhang isang bagay. Na mag-aanunsyo ito ng sarili nito. Na darating ito nang may bigat at kahalagahan at angkop na musika. Inaasahan natin na ang huling eksena ay magiging isang eksena \u2014 ang mga tao na nagsasabi ng mahahalagang bagay, sa wakas, sa bisa, sa isang sawa na espasyo habang may makabuluhang tumutugtog. Pero ganito ang hitsura ng aktwal na katapusan: pitong tao sa isang bangketa nang alas-onse ng gabi. Ang telepono ng isang tao na nagbu-buzz. Ang malapit na tunog ng lungsod na lungsod. Isang usapan tungkol sa pagkain. At sa ilalim ng lahat nito: ang tiyak na init ng mga taong dumaan sa isang mahirap na bagay nang magkasama at nandoon pa rin, kahit papaano. Pinipili pa rin ang parehong bangketa. Natutuklasan pa rin, nang walang pagsisikap, ang parehong kwarto.</p>\n  <div class=\"hugot-line\"></div>\n</div>\n\n<p>Nahuli ako ng tingin ni Keith bago sila umalis. Siya at si Ari ay aalis na \u2014 isang lugar, isang bagay na iba, ang kanilang sariling bersyon ng gabi. Tumingin siya sa akin sa paraan ng pagtingin niya sa akin ng isang taon na, mula sa karnabali, mula sa tatlong segundo sa itaas ng balikat ni Ari \u2014 ang tiyak na tingin ng isang taong nagpayapa sa isang bagay na hindi na nila kailanman mapangalanan. Kilala ko na ngayon ang tinging iyon. Isang taon ang ginugol ko sa pag-aaral ng hugis nito.</p>\n\n<p>Tumingin ako pabalik. Ngumiti ako \u2014 ang tunay, hindi ang pinamamahalaan na bersyon. Ngumiti rin siya.</p>\n\n<p>At sa niyon \u2014 sa dalawang segundo nito, sa init nito, sa paraan ng paglalapag nito nang eksakto sa paraan ng palaging paglalapag nito \u2014 sa wakas ay naunawaan ko ang isang bagay na pinaligiran ko ng maraming taon nang hindi ko ito pinayagang lapatan.</p>\n\n<div class=\"final-narration\" style=\"border-left:3px solid rgba(183,148,244,0.25);padding:1.5rem 1.8rem;margin:3rem 0;background:rgba(183,148,244,0.03);border-radius:0 12px 12px 0;\">\n  <p style=\"margin:0 0 1rem 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:rgba(232,223,245,0.6);line-height:2;\">Minahal niya ako. Alam ko na ngayon. Hindi ko kailangan pang malaman kung anong uri. Matagal akong nangangailangan na malaman \u2014 pinupulot ito, tinatanggal ang balot nito, sinusubukang hanapin ang salitang magpapagana nito. Hindi ko na ginagawa iyon. Minahal niya ako. Iyan ang buong pangungusap. Iyan ang bagay na sa wakas ay tinahimik ko ang pakikipagtalo.</p>\n  <p style=\"margin:0 0 1rem 0;color:rgba(232,223,245,0.5);line-height:1.9;\">Alam niya bago pa man ako. Iyon ang bahaging pinaka-matagal sa akin tanggapin. Hindi ang umalis niya \u2014 kundi ang umalis siya dahil naiintindihan niya ang isang bagay na hindi ko pa napangalanan. Nakita niya kung ano ang gagawin nito sa ating dalawa kung nananatili siya. Ako, dahan-dahan na nagtatayo ng buong tahimik na buhay ko sa paligid ng hugis niya \u2014 nang walang intensyon, nang walang pagpapasya, sa paraan ng paghahanap ng tubig sa pinakamababang punto. At siya, nagdadala ng isang bagay na walang pangalan, sa isang buhay na itinayo para hawakan ang napaka-tiyak na mga bagay.</p>\n  <p style=\"margin:0 0 1rem 0;color:rgba(232,223,245,0.5);line-height:1.9;\">Tahimik na umalis. Hindi nang may talumpati o isang pagbabagsak ng pintuan o alinman sa mga bagay na siyang naging mas madaling galit. Lang: nag-recalibrate. Nahanap ang eksakto na dami ng distansya na nagpapahintulot sa ating dalawa na huminga nang hindi kailangang sinuman ang magpaliwanag kung bakit.</p>\n  <p style=\"margin:0 0 1rem 0;color:rgba(232,223,245,0.5);line-height:1.9;\">Kinasuklaman ko siya para doon, nang tahimik, ng mas matagal kaysa gustong aminin ko. Dahil ang pagiging protektahan nang walang pahintulot mo ay mukhang pag-abandona pa rin \u2014 kahit alam mo, sa ilalim ng sakit, na tama ang tao. Kahit alam mo na ginawa nila ito dahil minahal ka nila. Kahit noon pa man.</p>\n  <p style=\"margin:0;color:rgba(232,223,245,0.5);line-height:1.9;\">Pero ang ngiti sa kabilang panig ng concert venue \u2014 iyon na ang hitsura nito ngayon. Isang taon mamaya. Walang bigat sa loob nito, walang kalungkutan, walang pagganap. Dalawang tao lang na naiintindihan ang isang bagay tungkol sa isa't isa na hindi nila kailanman sasabihin nang malakas. Hindi dahil hindi nila kaya. Dahil hindi na nila kailangan. Pareho kaming nandito pa rin. Pareho kaming nagdadala pa rin ng isang bagay na walang pangalan. Pareho kaming nagpapasya \u2014 nang hiwalay, nang tahimik, nang walang isang salita tungkol dito \u2014 na hayaang sapat na iyon. Sapat na ito. Masakit pa rin nang kaunti. Sa tingin ko palagi itong ganoon. Pero ganoon mo malalaman na totoo ito. Ang mga bagay na hindi nag-iiwan ng marka \u2014 ang mga iyon ang mga bagay na hindi mahalaga. Mahalaga ang isang ito. Palagi.</p>\n</div>\n\n<p>Pagkatapos ay umalis sila.</p>\n\n<p>Pinanood ko silang lumayo. Nagsabi si Ari ng isang bagay at natawa si Keith \u2014 ang buong isa, ang tunay, ang sumasakop sa buong mukha niya. Inilagay niya ang kanyang braso sa paligid niya at lumiko sila sa kanto at pagkatapos ay lang: wala na. Isang regular na Biyernes ng gabi. Dalawang tao na naglalakad patungo sa sariling bersyon nila ng gabi.</p>\n\n<p>Nakatayo ako roon nang sandali.</p>\n\n<p>Pagkatapos ay tumingin ako pababa.</p>\n\n<p>Natanggal ang aking shoelace. Ang kaliwa \u2014 lagi itong ang kaliwa. Tinitingnan ko ito nang isang segundo sa paraan ng pagtingin mo sa isang bagay kapag dumating ito sa eksakto maling at eksakto tamang oras.</p>\n\n<p>Yumuko ako at itinali ko ito nang mag-isa. Ang tamang paraan. Sa ibabaw, sa ilalim, sa pamamagitan. Sa paraan ng pag-aaral mo nito, ang aktwal na paraan, ang paraan na humahawak.</p>\n\n<p>Nagtayo ako ulit.</p>\n\n<p>Sa likod ko sinasabi ni Carlo ang isang bagay kay Abby. Natawa si Lauren. Si Owen ay may kamay sa case ni Cassiopea, ang pamilyar na kilos ng isang taong tinitiyak na nandoon pa rin ang minamahal nilang bagay. Ginagawa ng lungsod ang gabi nitong bagay sa paligid namin.</p>\n\n<p>At naisip ko \u2014 nang tahimik, nang walang drama, nang walang bigat na nangangailangan ng kahit anong seremonya:</p>\n\n<p style=\"text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:rgba(183,148,244,0.6);margin:2.5rem 0;line-height:2;\"><em>Anong gagawin mo nang wala ako.</em></p>\n\n<p>Sinabi niya ito nang magaan. Lasing. Limang inumin at isang tahimik na kalye at ibinaba ang filter nang sapat para makalabas ang mga tunay na bagay nang walang pagpapasya. Hindi ito tanong \u2014 walang infleksyon sa dulo, walang humihiling ng sagot. Hindi ako sumagot. Nagpatuloy lang ako sa paglalakad, at natanggal muli ang shoelace nang isang bloke mamaya, at wala kaming sinabi tungkol dito.</p>\n\n<p>Naiintindihan ko na ngayon. Ang talagang sinasabi niya. Hindi isang tanong tungkol sa shoelace. Isang tanong tungkol sa kung ano ang ibig sabihin ng shoelace \u2014 tungkol sa kung sino ako sa bersyon ng aking buhay kung saan tumitigil siyang magpakita. Kung magiging okay ako. Kung magiging okay ako.</p>\n\n<p>Umalis siya para malaman niya. Para malaman ko.</p>\n\n<p>Ang shoelace ay humawak.</p>\n<p>Magiging okay ako.</p>\n\n<div class=\"brk\">\u00b7 \u00b7 \u00b7</div>\n\n<div class=\"sec-head\">\n  <span class=\"sec-num\">Lima</span>\n  <span class=\"sec-title\">Kung Ano ang Alam Ko Ngayon</span>\n</div>\n\n<p>Mayroon tanong na palagi nilang tinatanong tungkol sa mga kwentong katulad nito. Tinatanong nila: paano ito natatapos? At ang ibig nilang sabihin ay \u2014 lahat ba ay nakuha ang gusto nila? Naresolba ba ang sakit? Nagsama-sama ba ang tamang mga tao? Sulit ba ito?</p>\n\n<p>Sampung kabanata ang pag-kwento ko sa kwentong ito at wala pa rin akong malinis na sagot sa kahit alinman sa mga iyon.</p>\n\n<p>Si Keith ay kasama si Ari. Masaya sila. Tunay iyon. Mas maayos na ang tulog ni Carlo. Tinanggal ni Abby ang thread. Inilapag ni Lauren ang telepono bago ang ika-apatnapu't limang replay at hindi na kinuha ito. Natapos ni Owen ang kanta. Tinahimik ko na ang pagsulat ng aking mga pakiramdam sa mga liham na nakaaddress sa ibang tao. At sa wakas ay naiintindihan ko na kung bakit umalis si Keith \u2014 hindi bilang abandono, hindi bilang pagtanggi, kundi bilang tiyak na gramatiko ng isang taong itinuro na ang pagmamahal ay nangangahulugang panatilihing hindi nasaktan ng iyo ang mga taong minamahal mo. Kahit ikaw ang tanging taong gusto nila.</p>\n\n<p>Pero nandoon pa rin si Vince sa lungsod na ito. Humingi ng tawad si Rein. Ni-block ni Alex si Owen at hindi ito na-unblock. Ang lola ni Carlo ay wala na rin, at ang mga Huwebes ay naiiba na ngayon, at hindi iyon naaayos. Ang ilang mga bagay na nangyari sa kwentong ito ay mga bagay na nangyari, punto. Hindi nila inaalis ang kanilang sarili. Nagiging bahagi na lang sila ng lupalop na tinatayo mo.</p>\n\n<p>Kaya kung naparito ka para sa malinis na katapusan \u2014 pasensya na. Wala akong ganoon. Hindi ko sa tingin ay magiging tapat ang bersyon ng kwentong ito.</p>\n\n<p>Ang mayroon ako sa halip ay ito:</p>\n\n<p>Limang tao na dumaan sa isang taon ng pinakamasamang bersyon ng mga bagay na kinatatakutan nila \u2014 ang mapag-iwanan, ang maging mali, ang hindi makita, ang magamit, ang maging isa na nagdadala ng lahat at walang natitira \u2014 at lumabas sa kabilang panig na nakatayo pa rin. Hindi naka-fix. Hindi gumaling sa paraan na nagpapahiwatig ng pagkakumpleto. Lang: nakatayo. Pinipili pa rin ang parehong lungsod. Natutuklasan pa rin ang parehong bangketa sa labas ng isang konsiyerto nang ika-onse ng gabi, nagsasalita tungkol sa pagkain, tumatawa sa isang ordinaryong bagay, nasa orbit ng isa't isa dahil iyon ang patuloy nilang pinipili, nang walang pahayag, nang walang drama, nang walang pormal na desisyon na manatili.</p>\n\n<p>Iyon ang katapusan. Alam ko na maaaring hindi iyon ang hinahanap mo. Pero sa tingin ko iyon ang pinakamatapat na bersyon na mayroon ako.</p>\n\n<p>Dahil narito ang natutunan ko \u2014 hindi mula sa pag-kwento ng kwentong ito kundi mula sa pamumuhay sa loob nito:</p>\n\n<p>Hindi mo kailangang maging tapos para sumuong. Hindi mo kailangan ang closure, ang pangwakas na usapan, ang sagot sa tanong na dinadala mo. Kaya kang maglakad nang may hawak na mga bukas na bagay. Kaya mong dalhin ang bigat at pa rin ay gumalaw. Maaari kang mapagod at nandito ka pa rin.</p>\n\n<p>Maaari kang mahalin ang isang taong hindi mo mataposang makasama. Maaari kang naging mali tungkol sa isang mahalagang bagay at pa rin ay magtiwala uli sa iyong sarili, dahan-dahan. Maaari kang ang taong iniwan, muli, at magpasya na ang pag-alis ay nagsasabi ng higit pa tungkol sa umaalis kaysa sa halaga mo. Maaari kang magpakita sa isang konsiyerto nang isang taon pagkatapos masira ang lahat at maramdaman, nakatayo sa crowd habang may tumutugtog ng natapos na kanta, na ang taon ay sulit na mabuwan.</p>\n\n<p>Hindi dahil huminto ang sakit. Dahil hindi ka nito pinigilan.</p>\n\n<p>Naging tagasalaysay ako. Ang isa na nanonood at nagtutala at nahanap ang mga pangungusap. Alam ko na hindi ako dapat lumabas ng frame ng kwentong ito sa paraan ng ginagawa ko ngayon. Pero sampung kabanata ka nang nandito. Umupo ka sa karnabali at sa kapilya at sa ulan at sa suntuking iyon at sa eulogy at lahat ng iyon. Karapat-dapat ka sa tapat na bersyon ng kung ano ang gustong sabihin ko, nang direkta, nang walang frame:</p>\n\n<p>Anuman ang dinadala mo \u2014 ang bukas na bagay, ang hindi naresolbang bagay, ang pangalang naiibang lumalapag pa rin, ang pintuan na kailangan mong nasara na bahagyang bukas pa \u2014 hindi mo kailangang matapos doon bago ka pinapayagang magpatuloy.</p>\n\n<p>Maaari kang magpatuloy pa rin.</p>\n\n<p>Nagpapatuloy ka na pa rin. Iyon ang dahilan kung bakit nandito ka pa sa katapusan nito.</p>\n\n<div class=\"final-narration\" style=\"margin:3rem 0;\">\n  <p style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:rgba(183,148,244,0.55);text-align:center;line-height:2;margin:0;\">Lumipas ang isang taon. Hindi naging madali ang mga bagay. Ilang gabi pa rin ay mahirap makatulog. Ilang pangalan ay naiibang lumalapag pa rin. Ilang pintuan ay bukas pa rin na gusto ko sanang sarado. Ilang sarado na gusto ko sanang bukas. Pero kaming lima ay nandito pa rin. Nasa parehong lungsod pa rin. Nakatatagpo pa rin ng parehong mga kwarto. Si Carlo, sa wakas ay nagpapahinga. Si Abby, nag-sesketch para sa kanyang sarili. Si Lauren, tumatawa mula sa isang lugar na tunay. Si Owen, tumutugtog ng natapos na kanta sa isang kwartong tunay na alam ang mga salita. At ako \u2014 natututo, dahan-dahan, na maging nasa loob ng kwento sa halip na nakatayo lang sa tabi nito. Iyon ang taon. Iyon ang hitsura kapag nagpapatuloy ang mga tao \u2014 hindi dahil naging madali ang mahirap na mga bagay, kundi dahil natagpuan nila, nang walang nagsasabi sa kanila, na gusto pa rin nila. Na ang pagnanais ay sapat na. Na hindi mo kailangang maging buo para gumalaw. Kailangan mo lang gumalaw.</p>\n</div>\n\n<div class=\"final-line-block\">\n  <p>Sa huli, lahat tayo ay naglalakad.</p>\n  <p>Ang parehong lungsod. Ang parehong panahon na nabuhayan natin.</p>\n  <p>Pagod, pa rin. Nandito, pa rin.</p>\n  <p>Sa sariling sapatos natin. Sa wakas.</p>\n</div>\n\n<div class=\"final-dots\">\u00b7 \u00b7 \u00b7</div>\n\n<div class=\"end-card\" style=\"background:rgba(183,148,244,0.04);border-color:rgba(183,148,244,0.15);\">\n  <span class=\"end-emoji\">\ud83d\udc9c</span>\n  <p class=\"end-title\" style=\"font-size:1.1rem;\">\u2014 The One Who Stays \u2014</p>\n  <p class=\"end-meta\" style=\"line-height:2.2;\">\n    <em>In My Shoes \u00b7 isang nobela \u00b7 kumpleto</em><br><br>\n    salamat sa pagbabasa ng lahat nito \u2014<br>\n    ang ulan, ang karnabali, ang kapilya, ang taon pagkatapos.<br>\n    salamat sa pananatili.<br>\n    para sa lahat ng nagpatuloy sa paglalakad<br>\n    kahit hindi pa alam kung saan.<br><br>\n    \ud83d\udc9c \ud83e\ude75 \ud83e\ude77 \ud83c\udfb8 \ud83d\udc9b\n  </p>\n</div>\n";
const letters_content = "<div style=\"max-width:680px;margin:0 auto;padding:4rem clamp(16px,5vw,40px) 6rem;\">\n\n<div style=\"text-align:center;margin-bottom:4rem;\">\n  <p style=\"font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:0.4em;text-transform:uppercase;color:rgba(183,148,244,0.35);margin:0 0 0.8rem 0;\">dean reyes \u00b7 ang tagapagsalaysay \u00b7 mga liham</p>\n  <h2 style=\"font-family:'DM Serif Display',serif;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:400;color:rgba(232,223,245,0.85);margin:0 0 0.5rem 0;letter-spacing:0.02em;\">Mga Liham Para sa Iyo</h2>\n  <p style=\"font-family:'Lora',serif;font-style:italic;font-size:1rem;color:rgba(183,148,244,0.5);margin:0;\">para sa mga may hawak ng mga bagay na hindi pa nila alam kung paano bibitawan</p>\n  <div style=\"width:40px;height:1px;background:rgba(183,148,244,0.2);margin:1.5rem auto 0;\"></div>\n</div>\n\n<!-- \u2500\u2500\u2500 LETTER 1 \u2500\u2500\u2500 -->\n<div class=\"dean-letter\" style=\"margin-bottom:5rem;\">\n  <div style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;\">\n    <div style=\"width:32px;height:32px;border-radius:50%;background:rgba(183,148,244,0.12);border:1px solid rgba(183,148,244,0.25);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:10px;color:rgba(183,148,244,0.6);flex-shrink:0;\">01</div>\n    <p style=\"font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(183,148,244,0.45);margin:0;\">para sa taong nagmamahal ng hindi niya alam kung paano itigil</p>\n  </div>\n  <div style=\"font-family:'Lora',serif;font-size:1.0rem;color:rgba(232,223,245,0.62);line-height:2.15;padding-left:0.5rem;\">\n    <p>Alam ko na hindi ka natutulog nang maayos. Alam ko dahil natutulog din ako nang ganoon nang maraming taon \u2014 ang uri kung saan humihiga ka at nandoon ang lahat, nagsasabog, at ang isipan mo ay palaging bumabalik sa parehong lugar tulad ng isang dila na naghahanap ng isang nababakanteng ngipin. Ang parehong mukha. Ang parehong usapan na gusto mong nangyari nang iba. Ang parehong pangalan na libo mong beses nang sinabi sa loob ng iyong ulo at hindi pa rin natatamis.</p>\n    <p>Nais kong sabihin sa iyo na ang pagmamahal na ganoon \u2014 ang malalim, walang pahintulot, lumasob sa lahat ng bahagi ng iyong mga gawi \u2014 ay hindi karamdaman. Hindi ka sira. Hindi ka nahina. Ang pagmamahal nang ganoon ay nangangahulugan na may kakayahan kang mahalin nang ganoon. Iyon ay isang bagay. Iyon ay isang napakagandang bagay, kahit ngayon ay pakiramdam na ito ay pinakamasamang bagay na nangyari sa iyo.</p>\n    <p>Ang masakit ay ito: maaari kang magmahal ng tao nang ganap, nang buong-buo, nang may lahat ng mayroon ka \u2014 at hindi iyon sapat para panatilihin sila. Hindi dahil may mali sa pagmamahal mo. Kundi dahil ang pagmamahal ay hindi sapat na kahalili para sa pagpili. At minsan, ang mga tao ay hindi pumipili sa iyo. Hindi dahil hindi ka mahal. Kundi dahil may ibang pinipili sila na hindi mo rin sila mapipigilan.</p>\n    <p>Iyon ang pinakamalupit na bahagi. Hindi ang pag-alis. Ang katotohanan na maaari kang maging tunay na mahal at hindi pa rin mapiling manatili kasama. Ang dalawa ay maaaring totoo nang sabay-sabay. Kailangan mo lang mabuhay sa parehong magkasamang totoo, at hindi ka nagtuturo sa iyo kung paano gawin iyon.</p>\n    <p>Pero narito ka pa rin. Nagbabasa ka pa rin. Ibig sabihin ay nagpapatuloy ka pa rin. At iyon \u2014 ang pagpapatuloy nang hindi mo namamalayan kung paano \u2014 ang pinakamahirap at pinaka-matapang na bagay na ginagawa ng kahit sinong tao.</p>\n    <p style=\"color:rgba(183,148,244,0.55);font-style:italic;\">Ipagpatuloy mo ang pagmamahal. Huwag hayaang ang pagsakit nito ay gawing palakasin mo ang puso mo laban sa mga bagay. Hindi iyon kalayaan. Iba lang ang uri ng kulungan.</p>\n  </div>\n</div>\n\n<!-- \u2500\u2500\u2500 LETTER 2 \u2500\u2500\u2500 -->\n<div class=\"dean-letter\" style=\"margin-bottom:5rem;\">\n  <div style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;\">\n    <div style=\"width:32px;height:32px;border-radius:50%;background:rgba(129,230,217,0.1);border:1px solid rgba(129,230,217,0.2);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:10px;color:rgba(129,230,217,0.55);flex-shrink:0;\">02</div>\n    <p style=\"font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(129,230,217,0.4);margin:0;\">para sa taong nagsimula nang maniwala na sila ang problema</p>\n  </div>\n  <div style=\"font-family:'Lora',serif;font-size:1.0rem;color:rgba(232,223,245,0.62);line-height:2.15;padding-left:0.5rem;\">\n    <p>May nagsabi sa iyo, sa iba't ibang paraan, sa napakatagal na panahon, na ang isang bagay sa iyo ang mali. Hindi nila ito sinabi nang direkta \u2014 bihirang direkta ang mga taong ginagawa ito. Sinabi nila ito sa tono ng kanilang boses kapag tinanong mo ang isang bagay. Sa paraan ng pagtingin nila sa iyo nang parang ikaw ang dahilan ng problema, anuman ang problema. Sa paraan ng patuloy mong hihilingin ang tawad para sa mga bagay na hindi mo kasalanan, dahil ang pag-hiling ng tawad ay naging mas madali kaysa pakikipagtalo.</p>\n    <p>At unti-unti, nagsimula kang maniwala sa kanila. Hindi sa isang malaking sandali. Sa daan-daang maliliit na sandali. Hanggang naging reflex na ito \u2014 ang pag-audit ng sarili mo muna bago mo suriin ang sitwasyon, ang pagtatanong na \"ano ang mali sa akin?\" bago mo matanong ang \"ano ang mali dito?\"</p>\n    <p>Kailangan ko kang sabihin nang ganap at nang klaro, nang hindi umaayos ng mga salita para hindi ito masyadong mabigat: Hindi ka ang problema. Ikaw ay isang taong naniwala sa napakamaingat na nakumpirmasyon ng isang taong kailangan nila kang maniwala sa kanya. Iyon ay ibang bagay. Iyon ay ang kanilang gawa, hindi ang iyong kalikasan.</p>\n    <p>Ang pinakamatapang bagay na maaari mong gawin ngayon ay hindi ang patawarin sila. Hindi ang kalimutan. Ang pinakamatapang bagay ay ang muling piliin ang iyong sariling pananaw. Ang muling maniwala sa kung ano ang nakita mo, na nararamdaman mo, na alam mo sa iyong katawan bago pa sila magsimulang kumbinsihin ka na ito ay mali.</p>\n    <p>Ang alam mo ay totoo. Ang naramdaman mo ay totoo. Ang mga bagay na nakita mo na sinabihan kang hindi mo nakita \u2014 nakita mo. At ang katotohanang ngayon ay nangangailangan kang alalahanin ito ay hindi dahil mahina ka. Dahil ginawa nila itong itahimik nang matagal.</p>\n    <p style=\"color:rgba(129,230,217,0.5);font-style:italic;\">Simulan mo ang muling pagtitiwala sa iyong sariling mga mata. Mabagal ito. Maaaring kahiya-hiya ito sa simula \u2014 ang dami ng oras na ginugol mo sa hindi pagtitiwala sa iyong sarili. Huwag hayaang mapahiya ka nito. Natututo ka lang. Ito ay pagsisimula. Ito ay sapat.</p>\n  </div>\n</div>\n\n<!-- \u2500\u2500\u2500 LETTER 3 \u2500\u2500\u2500 -->\n<div class=\"dean-letter\" style=\"margin-bottom:5rem;\">\n  <div style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;\">\n    <div style=\"width:32px;height:32px;border-radius:50%;background:rgba(246,173,85,0.1);border:1px solid rgba(246,173,85,0.2);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:10px;color:rgba(246,173,85,0.55);flex-shrink:0;\">03</div>\n    <p style=\"font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(246,173,85,0.4);margin:0;\">para sa taong napagod na sa pag-aasa</p>\n  </div>\n  <div style=\"font-family:'Lora',serif;font-size:1.0rem;color:rgba(232,223,245,0.62);line-height:2.15;padding-left:0.5rem;\">\n    <p>Mayroon kang folder. Hindi isang literal \u2014 isang mental. Ang lugar kung saan pinagsasama mo ang mga maliliit na bagay na hindi pa sapat para pangalanan bilang ebidensya ngunit hindi mo rin mapakawalan \u2014 ang tingin na tumagal nang isang segundo nang masyadong matagal, ang mensaheng sumagot nang mas maaga kaysa karaniwang sumasagot sila, ang paraan ng pagsasabi ng iyong pangalan na parang may ibig sabihin. Pinagsasama mo ang lahat ng ito at nagtatatayo ka ng isang kaso. Isang napakagandang kaso. At araw-araw ay nagdadagdag ka ng higit pang ebidensya at ginagawa mong mas matibay ang kaso.</p>\n    <p>Alam ko kung paano ito. Ginawa ko ito. Maraming taon ang ginugol ko sa pagtatayo ng napakamagandang kaso na hindi ko kailanman dinidinig sa tanging korte na mahalaga \u2014 ang isa kung saan ang isa pang tao ay kailangang ibigay ang kanilang bereto.</p>\n    <p>Narito ang bagay na natutunugan ko ngayon, na noon ay hindi ko kayang marinig: Hindi ka nag-o-overreact. Hindi ka nagmamahal nang masyadong marami. Ang pag-asa ay hindi isang depekto ng karakter. Pero may isang bagay na pinagpapalitan ang pag-asa nang hindi mapapansin \u2014 ang pagpupuno ng espasyo ng kanilang kawalan nang may mga salaysay na ikaw ang humihiram, pinapanatili ang isang taong hindi nandoon sa pamamagitan ng pag-interpret sa bawat piraso ng katibayan sa pinakamapagmahal na posibleng paraan.</p>\n    <p>Pagod ka na. Alam ko. Ilang beses mo nang na-hit ang refresh sa loob ng iyong ulo, ilang beses mong nilikha ang kuwento kung saan ang lahat ay may katuturan, ilang beses mong sinabihan ang sarili mo: isa pang linggo, isang huling pagkakataon, kahit isang malinaw na sagot lang.</p>\n    <p>Ang malinaw na sagot na hindi pa darating \u2014 iyon na ang sagot. Hindi ito ang bagay na gusto mong marinig. Pero ang katahimikan ng isang tao, kapag pinag-aralan mo nang matagal, ay may eksakto na kahulugan. At ang pag-asa ay hindi nagbabago ng kung ano ang sinasabi ng katahimikan.</p>\n    <p style=\"color:rgba(246,173,85,0.5);font-style:italic;\">Maaari kang pagod at umaasa pa rin nang sabay-sabay. Maaari kang nagdadala ng dalawa. Pero pakinggan mo ito: ang pag-asa ay hindi kailangang ibigay sa lahat. Maaari kang mag-alis ng pag-asa mula sa isang tao at ilagay ito sa kahit saan pa. Sa isang bagay na talagang tumatanggap. Sa isang bukas na pintuan sa halip na isang na hindi nagbubukas. Ang pag-asa mo ay karapat-dapat na may puntahan. Gamitin mo ito nang maayos.</p>\n  </div>\n</div>\n\n<!-- \u2500\u2500\u2500 LETTER 4 \u2500\u2500\u2500 -->\n<div class=\"dean-letter\" style=\"margin-bottom:5rem;\">\n  <div style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;\">\n    <div style=\"width:32px;height:32px;border-radius:50%;background:rgba(251,182,206,0.1);border:1px solid rgba(251,182,206,0.2);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:10px;color:rgba(251,182,206,0.55);flex-shrink:0;\">04</div>\n    <p style=\"font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(251,182,206,0.4);margin:0;\">para sa taong nagdadala ng lahat para hindi na kailangang magdala ng iba</p>\n  </div>\n  <div style=\"font-family:'Lora',serif;font-size:1.0rem;color:rgba(232,223,245,0.62);line-height:2.15;padding-left:0.5rem;\">\n    <p>Lagi kang nandoon. Iyon ang iyong reputasyon \u2014 ang taong laging nandoon. Ang hindi tigatigasan ng mga bagay. Ang nagtatanong kung kumain ka na, ang nagsisiguro na walang mag-uuwi nang mag-isa, ang nagpapanatili ng mga kamay na nagdadala nang habang kailangan ng sinuman na may hawak. Ginawa mo ito nang napakatagal na hindi mo na mapansin na ginagawa mo ito. Naging katawan mo na iyon.</p>\n    <p>At ngayon ay narito ka, pagod. Hindi ang uri ng pagod na naaayos ng tulog. Ang mas malalim na uri \u2014 ang pagod ng taong gumugol ng napaka-matagal na naging lalagyan para sa lahat ng iba na walang natitira pa para sa kanilang sarili. Ang pagod ng isang taong hindi maalam kung sino sila nang wala ang function nito.</p>\n    <p>Nais kong sabihin sa iyo ang isang bagay na malamang ay hindi mo naririnig nang madalas: Pinapayagan kang maging pabigat minsan. Pinapayagan kang mangailangan. Pinapayagan kang dumating sa isang lugar at hindi mo dala ang lahat at sabihin: pagod na ako, at hindi ko alam kung paano, at kailangan ko ng isang taong humawak sa mga bagay kasama ko ngayon.</p>\n    <p>Ang pagiging ang lalagyan ay hindi ang iyong layunin sa buhay. Ang pagiging mahal \u2014 na may magmamalasakit sa iyo, na magdadala ng mga bagay para sa iyo, na magtatanong kung kumain ka na \u2014 iyon ang layunin din. At ang mga taong talagang nagmamalasakit sa iyo ay nais iyon. Naghihintay sila para sa pagkakataon. Hindi ka nila hinahawakan bilang pabigat. Hinahawakan ka nila bilang isang taong mahal nila.</p>\n    <p>Ang pagkakaiba sa pagitan ng lalagyan at ng isang taong mahal ay ito: ang lalagyan ay walang saysay kapag wala itong hawak. Ang isang taong mahal ay may saysay palagi \u2014 kahit walang dala, kahit pagod, kahit para lang naroroon.</p>\n    <p style=\"color:rgba(251,182,206,0.5);font-style:italic;\">Hayaan mo silang magdala ng ilang bagay para sa iyo. Hindi lahat \u2014 kahit isa. Simula lang. Ang pag-aaral na tanggapin ang pag-aalaga nang walang pagsusuri kung karapat-dapat ka ay isa rin itong kasanayang kailangang sanay-in. At kapag natanggap mo ang una, mas madali ang pangalawa. At sa lalong madaling panahon, hindi mo na inaudit ang iyong sarili sa tuwing may nagbibigay ng magandang bagay sa iyo.</p>\n  </div>\n</div>\n\n<!-- \u2500\u2500\u2500 LETTER 5 \u2500\u2500\u2500 -->\n<div class=\"dean-letter\" style=\"margin-bottom:5rem;\">\n  <div style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;\">\n    <div style=\"width:32px;height:32px;border-radius:50%;background:rgba(246,201,14,0.1);border:1px solid rgba(246,201,14,0.18);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:10px;color:rgba(246,201,14,0.5);flex-shrink:0;\">05</div>\n    <p style=\"font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(246,201,14,0.4);margin:0;\">para sa taong natutong huwag magpabigat \u2014 at ngayon ay hindi alam kung paano humihingi</p>\n  </div>\n  <div style=\"font-family:'Lora',serif;font-size:1.0rem;color:rgba(232,223,245,0.62);line-height:2.15;padding-left:0.5rem;\">\n    <p>Natututo kang maging sapat na maliit mula pa nang maaga. Hindi kaya lahat ng mga kwento ay ganoon, pero ang iyo ay ganoon. May isang sandali kung saan natutunan mo na ang pangangailangan ng mga bagay ay nagpapanganib sa iyong kakayahang panatilihin ang mga tao. At mula noon, binago mo ang sarili mo. Naging mahusay ka sa pagiging hindi pabigat. Napaka-mahusay mo rito. Mahirap nang pabalikin.</p>\n    <p>Natuklasan mo, sa paglipas ng panahon, na naging mas madali ang musika kaysa sa mga tao. Ang musika ay hindi umaalis. Hindi ito nagbibigay ng feedback tungkol sa kung magkano ang dinadala mo. Nagtatanggap ito nang walang kondisyon at nagbibigay pabalik sa direksyon mo at hindi kailanman gumagawa ng mukha na ginagawa ng mga tao kapag nagpapakita ka ng masyadong marami.</p>\n    <p>Pero narito ang bagay na hindi sinasabi ng musika sa iyo: hindi ito pipili para sa iyo. Hindi ito magpapakita nang walang dahilan. Hindi ito magtatanong kung kumain ka na. Hindi ito maaaring maging tao na laging nandoon nang dumating ka.</p>\n    <p>Ang mga tao na laging nandoon nang dumating ka \u2014 ang mga iyon ang nagbibigay ng pahintulot na maging pabigat dahil hindi sila umaalis. Hindi mo kailangang kumita ng iyong presensya. Nandoon ka na. Sapat na iyon.</p>\n    <p>Huwag pre-magpasya para sa lahat na ayaw nilang magdala ng kahit anong bagay mo. Hayaan silang gumawa ng desisyon para sa kanilang sarili. Maaari kang magulat. Maaaring may mga tao sa paligid mo na naghihintay para bigyan mo sila ng pagkakataon na mapansin na ang pagdadala sa iyo ay hindi pabigat. Ito ay pribilehiyo. Ito ay regalo. Hahayaan mo ba silang ibigay ito sa iyo?</p>\n    <p style=\"color:rgba(246,201,14,0.45);font-style:italic;\">Sumulat ng kanta tungkol dito kung kailangan mo. Pero pagkatapos \u2014 maghanap ng isang tao para pakinggan ito nang live. Hindi bilang performance. Bilang pagbabahagi. Iyon ang pagkakaiba. Iyon ay simula.</p>\n  </div>\n</div>\n\n<!-- \u2500\u2500\u2500 LETTER 6 \u2014 THE MAIN ONE \u2500\u2500\u2500 -->\n<div class=\"dean-letter\" style=\"margin-bottom:5rem;\">\n  <div style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;\">\n    <div style=\"width:32px;height:32px;border-radius:50%;background:rgba(183,148,244,0.15);border:1px solid rgba(183,148,244,0.35);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:10px;color:rgba(183,148,244,0.7);flex-shrink:0;\">06</div>\n    <p style=\"font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(183,148,244,0.5);margin:0;\">para sa taong nag-iisip kung sulit pa ba ang magpatuloy</p>\n  </div>\n  <div style=\"font-family:'Lora',serif;font-size:1.05rem;color:rgba(232,223,245,0.67);line-height:2.2;padding-left:0.5rem;\">\n    <p>Ito ang pinakamahalaga sa mga liham na ito. Kaya binabasa ko ito nang pinaka-maingat.</p>\n    <p>Mayroon kang isang araw \u2014 o marahil ay ilang araw na nagtatampisaw sa iyo \u2014 kung saan pakiramdam mo ay hindi na sapat ang lakas. Kung saan ang bigat ng lahat ay hindi nakakaramdam na karapat-dapat na dalhin pa. Kung saan tinatanong mo ang sarili mo: Bakit pa? Para sa ano pa ito lahat?</p>\n    <p>Hindi kita kailangang hikayatin na ang mga damdaming iyon ay mali. Hindi ito mali. Ang pakiramdam ng pagod, ng pagkawala ng lakas, ng hindi na makita kung saan mapupunta ang lahat \u2014 ito ay tunay. Ito ay isang bahagi ng pagkatao, hindi isang karamdaman ng pagkatao.</p>\n    <p>Pero nandito ang sinasabi ko: ang pakiramdam na hindi mo na kaya ay hindi katotohanan na hindi mo na kaya. Ang pakiramdam at ang katotohanan ay magkaibang bagay. At sa pinaka-madilim na mga araw, ang ating mga pakiramdam ay bumibisita sa atin na may buong lakas at sinasabi na sila ang buong kwento. Hindi sila ang buong kwento.</p>\n    <p>Ikaw ay isang tao na nadadala ng napakaraming bagay ngayon. At ang bigat ng mga bagay na iyon ay tunay. At ang pagod na nararamdaman mo mula sa pagdadala nito ay tunay. Pero ang mga bagay na mabibigay ng bukas \u2014 ang posibilidad ng mga iyon \u2014 ay tunay din. At hindi ka mayroon ng alinman sa mga iyon kung hindi ka nandito para tanggapin ang mga ito.</p>\n    <p>Narinig ko ang mga kwentong katulad mo \u2014 mula sa mga taong nag-isip na wala nang dahilan para manatili at pagkatapos ay nanatili pa rin at natagpuan ang mga dahilan na hindi nila pa nakikita mula sa kinatatayuan nila sa oras na iyon. Hindi lahat ng mga dahon ay nakikita mula sa ilalim ng puno. Minsan kailangan mo munang lumakad nang ilang metro bago makita ang kahit anong bagay malibang ang anino.</p>\n    <p>Kung nag-iisip ka ngayon tungkol sa hindi na pagpapatuloy \u2014 mangyaring makipag-usap sa isang tao. Hindi kailangang maging isang malaking usapan. Hindi kailangang sabihin mo ang lahat sa unang pagkakataon. Maaari kang magsimula sa: \"Pakiramdam ko ay napakahirap ngayon.\" Iyon na ang simula. Iyon ay sapat.</p>\n    <p>Sa Pilipinas: <strong>In Touch Crisis Line</strong> \u00b7 <strong>0917 572 8654</strong><br>\n    National Center for Mental Health Crisis Hotline: <strong>1553</strong><br>\n    O makipag-usap sa sinumang mapagkakatiwalaang tao sa iyong buhay ngayon.</p>\n    <p style=\"color:rgba(183,148,244,0.6);font-style:italic;margin-top:1.5rem;\">At kung wala kang maisipan ngayon na makakausap \u2014 nandito pa rin ang kwentong ito. Nandito pa rin kami lahat, sa mga pahinang ito. At kung kinaya ni Carlo na tumayo sa harap ng kapilya at sabihin ang pinaka-tunay na bagay na kailanman niyang sinabing malakas, kahit na nanginginig ang boses niya at nalaglag ang microphone \u2014 kung kaya niya iyon, ikaw rin ay may kakayahan. Hindi ngayon. Pero balang araw. At ang balang araw ay dumadating para sa mga nanatili para makita ito.</p>\n    <p style=\"color:rgba(183,148,244,0.55);font-style:italic;font-size:0.95rem;\">Manatili. Mangyaring manatili.</p>\n  </div>\n</div>\n\n<!-- \u2500\u2500\u2500 LETTER 7 \u2014 THE FINAL ONE \u2500\u2500\u2500 -->\n<div class=\"dean-letter\" style=\"margin-bottom:5rem;\">\n  <div style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;\">\n    <div style=\"width:32px;height:32px;border-radius:50%;background:rgba(183,148,244,0.08);border:1px solid rgba(183,148,244,0.2);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:9px;color:rgba(183,148,244,0.5);flex-shrink:0;\">\u2726</div>\n    <p style=\"font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(183,148,244,0.4);margin:0;\">para sa lahat</p>\n  </div>\n  <div style=\"font-family:'Lora',serif;font-size:1.05rem;color:rgba(232,223,245,0.65);line-height:2.2;padding-left:0.5rem;\">\n    <p>Kasama ka sa kwentong ito mula sa simula. Hindi ako nakita mo, pero nakita kita. Ikaw ang binabasa ng lahat ng ito \u2014 ang ikinalungkot nang wala sa iyo ang iyong sarili, ang nagtataka kung magiging okay ka ba, ang nagtitiis sa mga gabing masyadong matagal at masyadong tahimik. Ikaw ang pinag-aalaga ng kwentong ito mula sa simula.</p>\n    <p>Nais kong sabihin sa iyo ang isang bagay na dinadala ko buong panahon ng pagsulat ng kwentong ito, isang bagay na natutunan ko mula sa mga taong pinakamahal ko:</p>\n    <p>Hindi mo kailangang maging buong para sumusulong. Hindi mo kailangan ang resolusyon, ang katapusan ng usapan, ang sagot sa tanong na dinadala mo. Maaari kang lumakad nang may hawak na mga bukas na bagay. Maaari mong dalhin ang bigat at pa rin ay gumalaw. Maaari kang mapagod at nandito ka pa rin.</p>\n    <p>Sinabihan ka ng maraming tao nang maraming beses: magiging mas mabuti lahat ng bagay. Minsan ito ay totoo. Minsan ang mga bagay ay hindi nagiging mas mabuti \u2014 nagiging pamilyar lang sila. Natutunan mo ang hugis nila. Natutunan mong mabuhay sa tabi nila nang hindi sila ang tanging bagay na naramdaman mo.</p>\n    <p>Pero narito ang bagay na totoo anuman ang mangyari: ang katotohanang nandito ka pa rin, pagkatapos ng lahat ng dinala mo \u2014 iyon ay hindi aksidente. Iyon ay isang uri ng lakas na hindi mo kilala bilang lakas dahil hindi ito dramatic. Hindi ito pagsabog ng tapang. Ito ay ang maliit, tahimik, araw-araw na gawa ng pagtuloy pa rin sa paglalakad kahit hindi mo palagi nalalaman kung saan.</p>\n    <p>Napatunayan mo na ang sarili mo. Hindi sa lahat ng tamang paraan, hindi nang lahat ng tamang oras, hindi nang walang ginawa kang mga pagkakamali. Ngunit dito ka, sa katapusan ng sampung kabanata, at nandito pa rin. Iyon ay sapat. Iyon ay higit sa sapat.</p>\n    <p>Ang susunod na kabanata ng buhay mo ay hindi isinulat ko. Isinusulat mo ito. Mula sa lahat ng narito \u2014 ang ulan, ang kapilya, ang natuklasang shoelace, ang natapos na kanta \u2014 mayroon kang isang bagay na hindi mayroon ang mga character ko: ang susunod. Ang bukas na pahina. Ang aksyon na hindi ko nalalaman ang pangalan.</p>\n    <p style=\"color:rgba(183,148,244,0.6);font-size:1.1rem;font-style:italic;text-align:center;padding:1.5rem 0;line-height:2;\">Isulat mo ito nang mabuti.<br>O isulat mo ito nang hindi tuwid \u2014 ito rin ay okay.<br>Isulat mo ito.</p>\n    <p>Salamat sa pagbabasa ng lahat nito. Salamat sa pananatili. Salamat sa pagpili, nang paulit-ulit, nang walang pormal na pahayag, na manatili sa kwento. Para sa lahat na nagpatuloy sa paglalakad kahit hindi pa alam kung saan papunta \u2014</p>\n    <p style=\"text-align:right;color:rgba(183,148,244,0.5);font-style:italic;margin-top:2rem;\">\u2014 Dean Reyes<br><span style=\"font-size:0.88rem;color:rgba(183,148,244,0.3);\">tagasalaysay \u00b7 The One Who Stays</span></p>\n  </div>\n</div>\n\n<div style=\"text-align:center;padding:3rem 0;border-top:1px solid rgba(183,148,244,0.1);\">\n  <p style=\"font-family:'DM Serif Display',serif;font-size:1.5rem;color:rgba(183,148,244,0.45);margin:0 0 0.5rem 0;\">in my shoes</p>\n  <p style=\"font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:0.4em;text-transform:uppercase;color:rgba(183,148,244,0.25);margin:0;\">ang nananatili \u00b7 kumpleto</p>\n  <p style=\"margin:1.5rem 0 0 0;font-size:1.3rem;\">\ud83d\udc9c \ud83e\ude75 \ud83e\ude77 \ud83c\udfb8 \ud83d\udc9b</p>\n</div>\n\n</div>\n";

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
  document.querySelectorAll('.tab-section').forEach(function(s){ s.classList.toggle('active', s.id==='tab-'+tab); });
  if(tab==='letters') {
    const lettersEl = document.getElementById('tab-letters');
    if(!lettersEl.dataset.loaded) {
      lettersEl.innerHTML = letters_content;
      lettersEl.dataset.loaded = '1';
      const io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting){ e.target.style.animationPlayState='running'; io.unobserve(e.target); } });
      },{threshold:0.05});
      lettersEl.querySelectorAll('.dean-letter').forEach(function(el){ el.style.animationPlayState='paused'; io.observe(el); });
    }
  }
}

function toggleEditMode(){
  editMode=!editMode;
  const btn=document.getElementById('edit-toggle-btn'),bar=document.getElementById('edit-bar'),inner=document.getElementById('tab-story');
  if(editMode){editSnapshot=inner.innerHTML;inner.classList.add('editable');inner.querySelectorAll('p,.hugot p,.sec-title,.end-title,.end-meta,.rx,.song-fragment p,.final-line-block p').forEach(function(el){el.setAttribute('contenteditable','true');});btn.classList.add('active');btn.textContent='✕ exit';bar.classList.add('show');document.getElementById('edit-status').textContent='click text to edit';}else{closeEditMode(false);}
}
function closeEditMode(keep){editMode=false;const inner=document.getElementById('tab-story'),btn=document.getElementById('edit-toggle-btn'),bar=document.getElementById('edit-bar');if(!keep&&editSnapshot)inner.innerHTML=editSnapshot;inner.classList.remove('editable');inner.querySelectorAll('[contenteditable]').forEach(function(el){el.removeAttribute('contenteditable');});btn.classList.remove('active');btn.textContent='✏ edit';bar.classList.remove('show');editSnapshot=null;}
async function saveInScreenEdit(){const inner=document.getElementById('tab-story'),status=document.getElementById('edit-status'),clone=inner.cloneNode(true);clone.querySelectorAll('[contenteditable]').forEach(function(el){el.removeAttribute('contenteditable');});const html=clone.innerHTML;status.textContent='saving...';const ok=await sbSave('dean',html);if(ok){status.textContent='✓ saved';setTimeout(function(){status.textContent='';closeEditMode(true);},1200);}else{status.textContent='⚠ error';}}
function cancelInScreenEdit(){closeEditMode(false);}
async function resetInScreenEdit(){if(!confirm('I-reset ang chapter 10?'))return;document.getElementById('edit-status').textContent='resetting...';await _sb.from('chapter_edits').delete().eq('chapter',CH_ID).eq('character','dean');document.getElementById('tab-story').innerHTML=story_content;closeEditMode(false);document.getElementById('edit-status').textContent='✓ reset';setTimeout(function(){document.getElementById('edit-status').textContent='';},1500);}
